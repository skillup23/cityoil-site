services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MONGODB_URI=${MONGODB_URI}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - NODE_OPTIONS=--max-old-space-size=256
    restart: unless-stopped
    # Строгие лимиты ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.5'    # Максимум 0.5 CPU
          memory: 256M   # Максимум 256MB RAM
        reservations:
          cpus: '0.2'    # Гарантировано 0.2 CPU
          memory: 128M   # Гарантировано 128MB RAM
